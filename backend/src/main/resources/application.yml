server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/short_video?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:shortvideo}
    password: ${DB_PASSWORD:shortvideo_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

app:
  jwt:
    secret: ${JWT_SECRET:short-video-course-project-secret-change-me-2026}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  storage:
    video-directory: ${VIDEO_DIRECTORY:../storage/videos}
    public-prefix: /media/videos/

